---
- name: Provision RetroDailyDriver M0 foundation
  hosts: all
  become: true
  gather_facts: true
  vars:
    retro_project_root: "{{ playbook_dir }}/../.."
  pre_tasks:
    - name: Require a Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
        fail_msg: >-
          RetroDailyDriver supports DietPi and compatible Debian-family hosts;
          detected {{ ansible_facts.os_family | default('unknown') }}.

  roles:
    - role: foundation
    - role: graphics
    - role: storage
    - role: appliance_manager
